<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-weight: normal;
      margin-bottom: 40px;
    }

    nav {
      text-align: center;
      margin-bottom: 40px;
    }

    nav a {
      margin: 0 12px;
      color: #111;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .info {
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Sofia Andersson</h1>

    <nav>
      <a href="/">Selected works</a>
      <a href="/exhibitions/">Exhibitions</a>
      <a href="/info/">Info</a>
    </nav>

    <div class="info">
      {{ .Content }}
    </div>

  </div>
</body>
</html>
